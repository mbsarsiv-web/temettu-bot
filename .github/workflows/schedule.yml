name: Haftalık Temettü Verisi Çek

on:
  schedule:
    # Cumartesi günü saat 03:00'te çalışır (UTC saatiyle 00:00)
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4  # <-- UYARIYI ÇÖZEN GÜNCELLEME (v3 idi, v4 oldu)

    - name: Python Kurulumu
      uses: actions/setup-python@v5  # <-- UYARIYI ÇÖZEN GÜNCELLEME (v4 idi, v5 oldu)
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Çalıştır ve Drive'a Yükle
      env:
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      run: |
        python isyatirim_temettu_cek.py
